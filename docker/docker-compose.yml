# 开发态：只起中间件，应用在宿主机跑
services:
    zzx-monitor-kafka:
        image: bitnami/kafka:3.9.0
        container_name: zzx-monitor-kafka
        ports:
            - '9093:9093'
            - '9094:9094'
        environment:
            - KAFKA_CFG_NODE_ID=1
            - KAFKA_CFG_PROCESS_ROLES=broker,controller
            - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093
            - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://0.0.0.0:9094
            - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://zzx-monitor-kafka:9092,EXTERNAL://localhost:9094
            - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
            - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
            - ALLOW_PLAINTEXT_LISTENER=yes
        volumes:
            - ./kafka_data:/bitnami/kafka/data

    zzx-monitor-clickhouse:
        image: clickhouse/clickhouse-server:25.3
        container_name: zzx-monitor-clickhouse
        ports:
            - '8123:8123' # HTTP 接口
            - '9000:9000' # Native 接口
        environment:
            - CLICKHOUSE_USER=default
            - CLICKHOUSE_PASSWORD=zzxclickhouse
        volumes:
            - ./clickhouse_data:/var/lib/clickhouse

    zzx-monitor-postgresql:
        image: bitnami/postgresql:17.4.0
        container_name: zzx-monitor-postgresql
        ports:
            - '5432:5432'
        environment:
            - POSTGRESQL_USERNAME=postgres
            - ALLOW_EMPTY_PASSWORD=yes
            - POSTGRESQL_DATABASE=postgres
        volumes:
            - ./postgresql_data:/bitnami/postgresql

    zzx-monitor-redis:
        image: bitnami/redis:7.4.2
        container_name: zzx-monitor-redis
        ports:
            - '6379:6379'
        environment:
            - REDIS_PASSWORD=zzxredis
        volumes:
            - ./redis_data:/bitnami/redis