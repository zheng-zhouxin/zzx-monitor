include:
    - docker-compose.yml

services:
    # 应用部署：Node 服务容器
    zzx-monitor-server:
        image: bitnami/node:latest
        container_name: zzx-monitor-server
        ports:
            - 8081:8081
        volumes:
            - ../:/app/monitor
        environment:
            - NODE_ENV=production
        working_dir: /app/monitor/apps/backend/monitor
        command: 'node dist/main.js'
        depends_on:
            - zzx-monitor-postgresql
            - zzx-monitor-redis
            - zzx-monitor-clickhouse
            - zzx-monitor-kafka